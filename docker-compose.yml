services:
  app:
    build: .
    container_name: ai-app-poses
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-lite-image}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - APP_USERNAME=${APP_USERNAME:-user}
      - APP_PASSWORD=${APP_PASSWORD}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - MAX_IMAGE_MB=${MAX_IMAGE_MB:-8}
      - MAX_PROMPT_CHARS=${MAX_PROMPT_CHARS:-4000}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-poses.rule=Host(`${APP_DOMAIN:-poses.aaaaaaaaa9000.cloud}`)"
      - "traefik.http.routers.ai-poses.entrypoints=websecure"
      - "traefik.http.routers.ai-poses.tls=true"
      - "traefik.http.routers.ai-poses.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-poses.loadbalancer.server.port=3000"
      - "traefik.docker.network=automation-stack_automation-network"

networks:
  default:
    name: automation-stack_automation-network
    external: true
