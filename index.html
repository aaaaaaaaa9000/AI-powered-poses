
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <title>AI-powered poses</title>
    <meta name="description" content="An AI-powered photo editing application that uses Gemini to transform your product images. Upload a photo, select customization options like lighting and perspective, and generate professional-quality product photos in seconds." />
    <meta property="og:title" content="AI-powered poses" />
    <meta property="og:description" content="An AI-powered photo editing application that uses Gemini to transform your product images. Upload a photo, select customization options like lighting and perspective, and generate professional-quality product photos in seconds." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.1.1/",
          "react": "https://aistudiocdn.com/react@^19.1.1",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/"
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0c0a09;
        background-image: 
          radial-gradient(circle at 0% 0%, hsla(215, 98%, 61%, 0.05) 0px, transparent 50%),
          radial-gradient(circle at 100% 0%, hsla(256, 96%, 67%, 0.05) 0px, transparent 50%),
          radial-gradient(circle at 50% 100%, hsla(355, 98%, 61%, 0.05) 0px, transparent 50%);
        color: #f0f0f0;
        margin: 0;
        overflow-x: hidden;
      }

      .glass-panel {
        background: rgba(22, 22, 22, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Transitions */
      .preset-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .preset-card:active {
        transform: scale(0.96);
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
